<script>
  /* Open external links in a new tab; internal links stay in the same tab.
   *
   * Done here rather than with per-link `{:target="_blank"}` attributes in the
   * markdown, for two reasons:
   *   1. _pages/research.md is the single source that _career/cv/scholar.py
   *      parses to build the CVs. Per-link attributes there would leak into the
   *      generated PDFs as literal "{:target=...}" text.
   *   2. _includes/selected-work.html is generated by _career/cv/build.py and
   *      would lose hand-added attributes on every refresh.
   *
   * `rel="noopener"` is set alongside: without it the opened page receives a
   * window.opener handle back to this one, which is a known phishing vector.
   *
   * IMPORTANT: this page's HTML is served minified, with every newline
   * collapsed to a space. A `//` line comment would therefore comment out the
   * whole remainder of the script. Use block comments only, never `//`.
   */
  (function () {
    function markExternalLinks() {
      var here = window.location.hostname;
      var links = document.querySelectorAll('a[href]');
      for (var i = 0; i < links.length; i++) {
        var a = links[i];
        var url;
        try {
          url = new URL(a.getAttribute('href'), window.location.href);
        } catch (e) {
          continue;  /* malformed href, leave it alone */
        }
        /* Skip mailto:, tel: and in-page anchors. */
        if (url.protocol !== 'http:' && url.protocol !== 'https:') {
          continue;
        }
        /* External only. Internal pages (/research/, /cv/) and the CV PDFs
           under /files/ deliberately stay in the same tab. */
        if (url.hostname !== here) {
          a.setAttribute('target', '_blank');
          a.setAttribute('rel', a.rel ? a.rel + ' noopener' : 'noopener');
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', markExternalLinks);
    } else {
      markExternalLinks();
    }

    /* The theme's greedy-nav moves nav links between .visible-links and
       .hidden-links after load; re-run so any moved link keeps its target. */
    window.addEventListener('load', markExternalLinks);
  })();
</script>
